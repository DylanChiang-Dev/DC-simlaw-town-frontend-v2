server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /legalworld {
    return 301 /legalworld/;
  }

  location /legalworld/ {
    rewrite ^/legalworld/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
